<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Screen Share Probe</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; margin: 0; padding: 20px; }
    button { width: 100%; padding: 18px; font-size: 20px; margin-bottom: 12px; border-radius: 10px; border: 0; }
    #start { background: #0a59f7; color: #fff; }
    #stop { background: #e84026; color: #fff; }
    #status { font-size: 14px; line-height: 1.6; white-space: pre-wrap; color: #9be7b1; }
    video { width: 100%; max-height: 240px; background: #000; margin-top: 12px; }
  </style>
</head>
<body>
  <h2>WebRTC screen share</h2>
  <button id="start">Start sharing</button>
  <button id="stop">Stop sharing</button>
  <div id="status">idle</div>
  <video id="preview" autoplay playsinline muted></video>
  <script>
    const status = (text) => {
      document.getElementById('status').textContent =
        new Date().toISOString().slice(11, 23) + '  ' + text;
    };
    let stream = null;
    document.getElementById('start').onclick = async () => {
      try {
        stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
        document.getElementById('preview').srcObject = stream;
        status('sharing, tracks=' + stream.getVideoTracks().length);
      } catch (err) {
        status('ERROR ' + err.name + ': ' + err.message);
      }
    };
    document.getElementById('stop').onclick = () => {
      if (stream) {
        stream.getTracks().forEach((t) => t.stop());
        stream = null;
        status('stopped');
      } else {
        status('not sharing');
      }
    };
  </script>
</body>
</html>
